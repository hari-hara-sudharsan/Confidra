name: Confidra CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-test:
    name: Lint & Test Applications
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Typecheck Backend
        run: npm run build --workspace=apps/backend
        
      - name: Typecheck Frontend
        run: npm run build --workspace=apps/frontend

  build-smart-contracts:
    name: Compile Blockchain Trust Layer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'blockchain/package-lock.json'
          
      - name: Install Hardhat Dependencies
        working-directory: ./blockchain
        run: npm ci
        
      - name: Compile Contracts
        working-directory: ./blockchain
        run: npx hardhat compile
        
      - name: Run Contract Tests
        working-directory: ./blockchain
        run: npx hardhat test

  build-docker-images:
    name: Build Production Docker Images
    runs-on: ubuntu-latest
    needs: [validate-and-test, build-smart-contracts]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build TEE Worker Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/tee-worker
          push: false
          tags: confidra-tee-worker:latest
          
      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/backend/Dockerfile
          push: false
          tags: confidra-backend:latest
          
      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/frontend/Dockerfile
          push: false
          tags: confidra-frontend:latest
